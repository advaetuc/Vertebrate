[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vertebrate"
version = "0.1.0"
description = "Local desktop pose observation: Phase P0 foundation"
requires-python = ">=3.12"
dependencies = [
  "ultralytics==8.3.203", "torch==2.8.0", "torchvision==0.23.0",
  "numpy==2.2.6", "opencv-python==4.12.0.88", "PySide6==6.9.2",
  "lap==0.5.12", "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
vertebrate = "vertebrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real local assets and dependency integration"]
